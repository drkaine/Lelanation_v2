# Images du jeu : variante WebP + cache immuable par patch.
# Installation (sudo) dans /etc/nginx/sites-available/lelanation.conf — voir actions.md.

# 1) En haut du fichier, hors de tout bloc server { } (niveau http) :
map $http_accept $webp_suffix {
    default        "";
    "~*image/webp" ".webp";
}
map $arg_v $game_img_cache {
    default "public, max-age=31536000, immutable";  # ?v=16.1.1 : URL change à chaque patch
    ""      "public, max-age=604800";
}

# 2) Dans server { }, AVANT « location ~* ^/(images|icons|og|data)/ » :
location ^~ /images/game/ {
    root $front_public;
    # x.png.webp (générée à la synchro) si le navigateur accepte WebP, sinon x.png, sinon Nitro
    try_files $uri$webp_suffix $uri @nuxt;
    include snippets/lelanation-security-headers.conf;
    add_header Vary Accept always;
    add_header Cache-Control $game_img_cache always;
    access_log off;
}

# 3) Dans server { }, AVANT « location ~* ^/(images|icons|og|data)/ » (ordre des regex = priorité) :
# résumés visuels des patch notes (x-summary.png.webp générée à la publication, WebP qualité 90).
location ~* ^/data/patch-notes/.+\.(png|jpe?g)$ {
    root $front_public;
    try_files $uri$webp_suffix $uri @nuxt;
    include snippets/lelanation-security-headers.conf;
    add_header Vary Accept always;
    add_header Cache-Control "public, max-age=604800" always;
    access_log off;
}
